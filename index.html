<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE HELION COMPACT</title>
  <meta name="description" content="Hard-political science fiction. Seven books. One Compact crime." />
  <link rel="canonical" href="https://helioncompact.com/" />
  <meta name="theme-color" content="#0a0c0b" />
  <style>
    :root { color-scheme: dark; --bg:#0a0c0b; --ink:#ede8dc; --gold:#c9a15a; --mute:#9a9588; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Georgia, "Times New Roman", serif; background:var(--bg); color:var(--ink); min-height:100dvh; display:grid; place-items:center; padding:2rem; }
    main { max-width:36rem; text-align:center; }
    .eyebrow { letter-spacing:.18em; text-transform:uppercase; font-size:.72rem; color:var(--gold); font-family: system-ui, sans-serif; }
    h1 { font-weight:400; font-size:clamp(2rem,6vw,3rem); line-height:1.15; margin:.75rem 0; }
    p { color:var(--mute); line-height:1.55; }
    .note { margin-top:2rem; font-size:.85rem; color:var(--mute); font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A seven-book cycle</p>
    <h1>THE HELION COMPACT</h1>
    <p>Hard-political science fiction. Ice, intent, and the crime already under the floor.</p>
    <p class="note">Coming — public landing under construction. Canon lives off this site.</p>
  </main>
</body>
</html>
